app:
  name: FlowAssist Chatbot
  version: 1.0.0

data:
  raw_dir: data/raw_data
  processed_dir: data/processed_data
  schema_dir: data/schema

chunking:
  chunking_size: 512
  overlap_size: 50

embedding:
  model_name: intfloat/multilingual-e5-small
  vector_size: 384
  batch_size: 32
  device: cpu

vector_store:
  type: tidb
  database_url: TIDB_DATABASE_URL 
  table: embeddings_documents
  distance: cosine
  timeout: 30

retrieval:
  top_k: 5
  score_threshold: 0.3

llm:
  provider: ollama
  model_name: qwen2.5:3b
  base_url: http://localhost:11434
  temperature: 0.2
  max_tokens: 1024             
  timeout: 60   

